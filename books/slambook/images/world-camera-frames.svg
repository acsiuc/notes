<svg xmlns="http://www.w3.org/2000/svg" width="680" height="320" viewBox="0 0 680 320" role="img" aria-labelledby="t d">
  <title id="t">World frame, camera frame, and a point p</title>
  <desc id="d">Two coordinate frames. The world frame has axes x, y, z. The camera frame is shifted and tilted compared with the world frame, and has its own axes x, y, z. A curved arrow T leads from the world frame to the camera frame. A point p is joined to both frame origins by dashed lines.</desc>
  <defs>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#848d97" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#378ADD" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#BA7517" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- world frame -->
  <line x1="150" y1="220" x2="100" y2="260" stroke="#848d97" stroke-width="2" marker-end="url(#arrow-gray)"/>
  <line x1="150" y1="220" x2="260" y2="220" stroke="#848d97" stroke-width="2" marker-end="url(#arrow-gray)"/>
  <line x1="150" y1="220" x2="150" y2="110" stroke="#848d97" stroke-width="2" marker-end="url(#arrow-gray)"/>
  <text x="86" y="272" text-anchor="middle" font-family="sans-serif" font-size="15" font-style="italic" fill="#848d97">x<tspan dy="4" font-size="11">W</tspan></text>
  <text x="274" y="225" text-anchor="middle" font-family="sans-serif" font-size="15" font-style="italic" fill="#848d97">y<tspan dy="4" font-size="11">W</tspan></text>
  <text x="150" y="98" text-anchor="middle" font-family="sans-serif" font-size="15" font-style="italic" fill="#848d97">z<tspan dy="4" font-size="11">W</tspan></text>

  <!-- camera frame -->
  <line x1="500" y1="150" x2="460" y2="188" stroke="#378ADD" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <line x1="500" y1="150" x2="595" y2="170" stroke="#378ADD" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <line x1="500" y1="150" x2="486" y2="50" stroke="#378ADD" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <text x="448" y="202" text-anchor="middle" font-family="sans-serif" font-size="15" font-style="italic" fill="#378ADD">x<tspan dy="4" font-size="11">C</tspan></text>
  <text x="609" y="176" text-anchor="middle" font-family="sans-serif" font-size="15" font-style="italic" fill="#378ADD">y<tspan dy="4" font-size="11">C</tspan></text>
  <text x="486" y="38" text-anchor="middle" font-family="sans-serif" font-size="15" font-style="italic" fill="#378ADD">z<tspan dy="4" font-size="11">C</tspan></text>

  <!-- transformation arrow -->
  <path d="M190 190 Q320 70 478 146" fill="none" stroke="#BA7517" stroke-width="2" marker-end="url(#arrow-amber)"/>
  <text x="322" y="104" text-anchor="middle" font-family="sans-serif" font-size="18" font-style="italic" fill="#BA7517">T</text>

  <!-- point p -->
  <line x1="150" y1="220" x2="465" y2="264" stroke="#848d97" stroke-width="1.5" stroke-dasharray="5 4"/>
  <line x1="500" y1="150" x2="472" y2="259" stroke="#848d97" stroke-width="1.5" stroke-dasharray="5 4"/>
  <circle cx="470" cy="265" r="5" fill="none" stroke="#848d97" stroke-width="1.5"/>
  <text x="484" y="274" font-family="sans-serif" font-size="18" font-style="italic" fill="#848d97">p</text>

  <!-- captions -->
  <text x="150" y="305" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#848d97">World frame</text>
  <text x="530" y="305" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#848d97">Camera frame</text>
</svg>
